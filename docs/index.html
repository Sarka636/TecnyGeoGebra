    <meta name="description" content="Didaktická aplikace s GeoGebrou pro procvičování konstrukce tečen ke kružnici pro žáky SŠ." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>

  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root">
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background-color: #f8fafc; color: #0f172a;">
        <div style="max-width: 480px; width: 100%; background: #ffffff; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; text-align: center;">
          <div style="width: 48px; height: 48px; background: #e0f2fe; color: #0284c7; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          </div>
          <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #0f172a;">Načítání aplikace...</h2>
          <p style="font-size: 14px; line-height: 1.6; color: #64748b; margin-bottom: 20px;">
            Pokud se aplikace nenačte automaticky, přejděte na zkompilovanou verzi v podsložce <strong>/docs/</strong> nebo v nastavení repozitáře (<em>Settings &rarr; Pages</em>) přepněte složku na <strong>/docs</strong>.
          </p>
          <a id="docs-redirect-btn" href="./docs/" style="display: inline-block; padding: 10px 20px; background: #2563eb; color: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none; border-radius: 10px;">
            Přejít do aplikace (/docs)
          </a>
        </div>
      </div>
    </div>
    <script>
      // Automatically redirect to /docs/ if unbuilt root index.html is loaded directly on GitHub Pages
      try {
        if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
          var uncompiledScript = document.querySelector('script[src*="main.tsx"]');
          if (uncompiledScript) {
            var target = window.location.pathname.replace(/\/+$/, '') + '/docs/';
            window.location.replace(target);
          }
        }
      } catch (e) {}
    </script>
  </body>
